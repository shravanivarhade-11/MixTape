# --- MySQL connection ---
# Update the username/password to match your local MySQL setup.
# createDatabaseIfNotExist=true means you don't have to manually CREATE DATABASE first.
spring.datasource.url=jdbc:mysql://localhost:3306/mixtape?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# ddl-auto=update means Hibernate will create/update tables automatically from the
# @Entity classes on startup. Great for development. Switch to "validate" once your
# schema is stable in a real project.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Server ---
server.port=8080
